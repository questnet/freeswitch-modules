name: qa

on:
  push:
    branches: [questnet]
  pull_request:
  workflow_dispatch:

# a new push to the same branch or PR cancels the runs still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-fs]
    env:
      # the FreeSWITCH build stage is shared by both targets, so both use one cache scope
      DOCKER_BUILD_FLAGS: --load --cache-from type=gha,scope=qa --cache-to type=gha,scope=qa,mode=max
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      # exposes the cache service token that `--cache-to type=gha` needs to plain `docker build`
      - uses: crazy-max/ghaction-github-runtime@v3
      - run: just ${{ matrix.target }}
