[workspace]
resolver = "3"
members = ["freeswitch", "audio_fork", "mod_audio_fork", "test_server", "fs_tests"]
# fs_tests needs a running FreeSWITCH, see docs/testing-plan.md#real-fs-tier
default-members = ["freeswitch", "audio_fork", "mod_audio_fork", "test_server"]

[workspace.package]
edition = "2024"
license = "MIT OR AGPL-3.0-only"
publish = false

[workspace.dependencies]
freeswitch = { path = "freeswitch" }
audio_fork = { path = "audio_fork" }
test_server = { path = "test_server" }
bindgen = "0.73"
parking_lot = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
proptest = "1.12"
rtrb = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = "1.53"
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }

[profile.release]
debug = 1
