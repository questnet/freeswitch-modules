[package]
name = "mod_audio_fork"
description = "FreeSWITCH module that forks call audio to a WebSocket server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
audio_fork.workspace = true
freeswitch.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# API subcommands that force panics, for the panic containment tests (T9); never in release images
test-hooks = []
